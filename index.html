<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Das hätte Betrug sein können</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root { --bg: #F3F5F8; --ink: #16202E; --alert: #C8102E; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F1520; --ink: #EEF2F7; --alert: #FF5A6E; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Archivo", Arial, sans-serif; font-size: 17px; line-height: 1.5; }
  main { max-width: 34rem; min-height: 100vh; margin: 0 auto; padding: 32px 16px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--alert); display: flex; align-items: center; gap: 8px; }
  .eyebrow::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--alert); }
  .finder { position: relative; padding: 26px 22px; }
  .finder span { position: absolute; width: 30px; height: 30px; border: 0 solid var(--alert); }
  .tl { top: 0; left: 0; border-top-width: 4px !important; border-left-width: 4px !important; border-top-left-radius: 8px; }
  .tr { top: 0; right: 0; border-top-width: 4px !important; border-right-width: 4px !important; border-top-right-radius: 8px; }
  .bl { bottom: 0; left: 0; border-bottom-width: 4px !important; border-left-width: 4px !important; border-bottom-left-radius: 8px; }
  .br { bottom: 0; right: 0; border-bottom-width: 4px !important; border-right-width: 4px !important; border-bottom-right-radius: 8px; }
  h1 { margin: 0; font-weight: 800; font-size: clamp(2.4rem, 11vw, 3.6rem); line-height: 1.02; letter-spacing: -0.02em; }
  h1 em { font-style: normal; color: var(--alert); }
  p { margin: 0; font-size: 1.1rem; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">QR-Code gescannt</div>
  <div class="finder">
    <span class="tl"></span><span class="tr"></span><span class="bl"></span><span class="br"></span>
    <h1>Das hätte <em>Betrug</em> sein können.</h1>
  </div>
  <p>Sie haben gerade einen QR-Code geöffnet, ohne vorher zu sehen, wohin er führt. Genau so beginnt <strong>Quishing</strong>.</p>
</main>
</body>
</html>
